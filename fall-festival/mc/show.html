<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1c120b">
<title>Fall Fest MC Script</title>
<script>
/* Always fresh on reload, no popup. */
var BUILD='20261114-161758';
(function(){
  if(location.protocol==='file:') return;
  function check(){
    fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
      if(!j||!j.build||j.build===BUILD) return;
      var k='mcs-fresh-'+j.build; try{ if(sessionStorage.getItem(k)) return; sessionStorage.setItem(k,'1'); }catch(e){}
      var u=new URL(location.href); u.searchParams.set('v',j.build); location.replace(u.toString());
    }).catch(function(){});
  }
  check();
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) check(); });
  addEventListener('pageshow',function(e){ if(e.persisted) check(); });
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf4ea; --card:#ffffff; --ink:#2a1a10; --mute:#7a6253; --line:#ead9c6;
  --rust:#b5401c; --gold:#d99a1e; --leaf:#5c7a2e; --chip:#f3e6d5; --fs:19px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c120b; --card:#2a1c12; --ink:#f6eadb; --mute:#bba48f; --line:#3e2b1d;
    --rust:#ef7a4f; --gold:#f2b84b; --leaf:#a3c46b; --chip:#3a281a;
  }
}
:root[data-theme="dark"]{
  --bg:#1c120b; --card:#2a1c12; --ink:#f6eadb; --mute:#bba48f; --line:#3e2b1d;
  --rust:#ef7a4f; --gold:#f2b84b; --leaf:#a3c46b; --chip:#3a281a;
}
*{box-sizing:border-box}
html,body{overflow-x:hidden;overflow-x:clip}
html{scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.45 Nunito,system-ui,sans-serif;-webkit-text-size-adjust:100%}
header{max-width:760px;margin:0 auto;padding:20px 16px 6px}
h1{font:400 30px/1.05 'Alfa Slab One',serif;color:var(--rust);margin:0 0 4px}
.sub{color:var(--mute);margin:0;font-size:14px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tool{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 12px;font:800 14px Nunito;cursor:pointer;text-decoration:none;min-height:40px;display:inline-flex;align-items:center}
.tool[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:#fff}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav .in{max-width:760px;margin:0 auto;padding:8px 16px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav .in::-webkit-scrollbar{display:none}
nav a{flex:0 0 auto;text-decoration:none;color:var(--ink);background:var(--chip);border-radius:999px;padding:8px 13px;font:800 14px Nunito}
main{max-width:760px;margin:0 auto;padding:4px 16px 100px}
section{padding-top:10px}
h2{font:400 26px/1.1 'Alfa Slab One',serif;color:var(--rust);margin:24px 0 6px}
h3{font:800 13px Nunito;letter-spacing:1.4px;text-transform:uppercase;color:var(--leaf);margin:20px 0 6px}
.info{background:var(--card);border:2px solid var(--gold);border-radius:14px;padding:12px 14px;margin-top:14px}
.info p{margin:4px 0}
.info b{color:var(--rust)}
.line{padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.t{font-size:var(--fs);font-weight:700;margin:0}
.t .h{font-size:.8em;margin-right:4px}
.pbp .t{font-family:'Alfa Slab One',serif;font-weight:400;font-size:calc(var(--fs) - 2px)}
.n{margin:3px 0 0;color:var(--mute);font-style:italic;font-size:15px}
.grp{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
.grp.dim{opacity:.7;border-style:dashed}
.tag{display:inline-block;font:800 11px Nunito;letter-spacing:.8px;text-transform:uppercase;background:var(--chip);color:var(--mute);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:2px}
details{background:var(--card);border:2px dashed var(--gold);border-radius:14px;padding:10px 14px;margin-top:8px}
summary{font-weight:800;cursor:pointer}
details ol{margin:8px 0 4px;padding-left:22px}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:6px}
.team{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-weight:700}
.team small{display:block;color:var(--mute);font:800 12px Nunito}
.empty{color:var(--mute);font-style:italic}
.foot{color:var(--mute);font-size:13px;text-align:center;margin-top:30px}
</style>
</head>
<body>
<header>
  <h1>🌽 Fall Fest MC Script</h1>
  <p class="sub" id="stamp">Only your ✅ Keep lines, in show order.</p>
  <div class="tools">
    <button class="tool" id="wake" aria-pressed="false">☀️ Keep screen on</button>
    <button class="tool" id="big" aria-pressed="false">🔍 Bigger text</button>
    <a class="tool" id="edit" href="./">✏️ Edit picks</a>
  </div>
</header>
<nav aria-label="Jump to"><div class="in" id="nav"></div></nav>
<main id="main"><p class="empty">Loading…</p></main>
<script src="data.js?v=20261114-161758"></script>
<script>
var KEY=(location.hash.match(/k=([a-z0-9-]+)/)||[])[1]||'';
var API='https://api.jobhubgo.com/api/yam/mcfest-'+KEY;
var HEAT=['😇','😏','😈'];
var R=null, when=0;
function $(s){return document.querySelector(s)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
if(KEY) $('#edit').href='./#k='+KEY;
try{ var c=JSON.parse(localStorage.getItem('mcs-'+KEY)||'null'); if(c){ R=c.data; when=c.when; } }catch(e){}

function ans(id){ return ((R.answers||{})[id]||{}).a||''; }
function lineHtml(l,pbp){
  return '<div class="line'+(pbp?' pbp':'')+'"><p class="t"><span class="h" aria-hidden="true">'+HEAT[l[1]]+'</span>'+esc(l[2])+'</p>'+(l[3]&&!/Pick |pick one|Replaces|Course changed|From the meeting|Optional|merged|Careful|⚠️|Only for|Meeting idea|Works whether|Spicier version/i.test(l[3])?'<p class="n">'+esc(l[3])+'</p>':'')+'</div>';
}
function render(){
  if(!R){ $('#main').innerHTML='<p class="empty">'+(KEY?'Can’t reach the server and nothing saved on this phone yet. Open once with signal.':'Open your private link (the one with #k=).')+'</p>'; return; }
  var rv=R.reviews||{}, h='', nav='';
  var info=[['Prizes',ans('m5')],['Who brings them',ans('m12')],['Hand out',ans('m13')],['Game order',ans('m6')],['Judge / ties',ans('m7')]].filter(function(x){return x[1]});
  if(info.length) h+='<div class="info">'+info.map(function(x){return '<p><b>'+x[0]+':</b> '+esc(x[1])+'</p>'}).join('')+'</div>';
  S.forEach(function(sec){
    if(sec.k==='meet') return;
    var title=sec.rules?sec.rules.title:sec.name;
    nav+='<a href="#s-'+sec.k+'">'+sec.emoji+' '+esc(sec.name)+'</a>';
    h+='<section id="s-'+sec.k+'"><h2>'+sec.emoji+' '+esc(title)+'</h2>';
    var ro=(R.roster||{})[sec.k];
    if(ro){
      var teams=(ro.teams||[]).filter(function(t){return t&&t.some(function(x){return x&&x.trim()})});
      if(TEAM[sec.k]&&TEAM[sec.k].vol){ if(ro.count) h+='<h3>👥 '+esc(ro.count)+' teams of '+TEAM[sec.k].size+'</h3><p class="n">Volunteers, called up on the spot.</p>'; }
      else if(teams.length||ro.count){
        h+='<h3>👥 '+(sec.k==='g1'?'Couples':'Teams')+(ro.count?' ('+esc(ro.count)+')':'')+'</h3><div class="teams">'
          +teams.map(function(t,i){return '<div class="team"><small>'+(sec.k==='g1'?'Couple':'Team')+' '+(i+1)+'</small>'+esc(t.filter(Boolean).join(' & '))+'</div>'}).join('')+'</div>';
      }
    }
    if(sec.rules) h+='<details><summary>📜 Official rules</summary><ol>'+sec.rules.steps.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ol><b>'+esc(sec.rules.go)+'</b></details>';
    sec.groups.forEach(function(g){
      var name=g[0], ls=g[1], pbp=/^Play-by-play/.test(name);
      var kept=ls.filter(function(l){ var r=rv[l[0]]; return r&&r.s==='keep'; });
      var unrated=ls.filter(function(l){ return !rv[l[0]]||!rv[l[0]].s; });
      if(pbp){ h+='<h3>🎙️ Play-by-play ideas</h3><div class="grp pbp">'+ls.map(function(l){return lineHtml(l,1)}).join('')+'</div>'; return; }
      if(kept.length){ h+='<h3>'+esc(name.replace(/ \(keep as is\)/,''))+'</h3><div class="grp">'+kept.map(function(l){return lineHtml(l)}).join('')+'</div>'; }
      else if(unrated.length){ h+='<h3>'+esc(name)+'<span class="tag">not picked yet</span></h3><div class="grp dim">'+unrated.map(function(l){return lineHtml(l)}).join('')+'</div>'; }
    });
    (R.adds||[]).filter(function(a){return a.sec===sec.k&&!a.gone&&!/^Thinking/.test(a.t)}).forEach(function(a,i){
      if(!i) h+='<h3>Your own lines</h3>';
      h+='<div class="grp"><div class="line"><p class="t">'+esc(a.t)+'</p></div></div>';
    });
    h+='</section>';
  });
  h+='<p class="foot">Picks as of '+(when?new Date(when).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'now')+'. Saved on this phone, works without signal.</p>';
  $('#nav').innerHTML=nav; $('#main').innerHTML=h;
}
function load(){
  if(!KEY){ render(); return; }
  fetch(API,{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
    if(j&&j.data){ R=j.data; when=Date.now(); try{ localStorage.setItem('mcs-'+KEY,JSON.stringify({data:R,when:when})); }catch(e){} }
    render();
  }).catch(render);
}
document.addEventListener('visibilitychange',function(){ if(!document.hidden){ load(); if(lock===null&&want) wake(); } });

/* keep the screen on while MC'ing */
var lock=null, want=false;
function wake(){
  if(!('wakeLock' in navigator)){ $('#wake').textContent='☀️ Not on this phone'; return; }
  navigator.wakeLock.request('screen').then(function(l){ lock=l; $('#wake').setAttribute('aria-pressed','true'); l.addEventListener('release',function(){ lock=null; $('#wake').setAttribute('aria-pressed','false'); }); }).catch(function(){});
}
$('#wake').onclick=function(){ if(lock){ want=false; lock.release(); } else { want=true; wake(); } };
var big=false; try{ big=localStorage.getItem('mcs-big')==='1'; }catch(e){}
function setBig(){ document.documentElement.style.setProperty('--fs',big?'24px':'19px'); $('#big').setAttribute('aria-pressed',big); }
$('#big').onclick=function(){ big=!big; try{localStorage.setItem('mcs-big',big?'1':'0')}catch(e){} setBig(); };
setBig(); render(); load();
</script>
</body>
</html>
