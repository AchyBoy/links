<style>
:root{
  --bg:#fbf4ea; --card:#ffffff; --ink:#2a1a10; --mute:#7a6253; --line:#ead9c6;

  --keep:#2f7d32; --keepbg:#e5f3e3; --tweak:#b07a00; --tweakbg:#fff3d4; --cut:#b3261e; --cutbg:#fbe3e1;
  --chip:#f3e6d5;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c120b; --card:#2a1c12; --ink:#f6eadb; --mute:#bba48f; --line:#3e2b1d;
    --rust:#ef7a4f; --gold:#f2b84b; --leaf:#a3c46b;
    --keep:#7fd283; --keepbg:#1f3a20; --tweak:#f2c14b; --tweakbg:#3d2f0e; --cut:#ff8a80; --cutbg:#45201c;
    --chip:#3a281a;
  }
}
:root[data-theme="dark"]{
  --bg:#1c120b; --card:#2a1c12; --ink:#f6eadb; --mute:#bba48f; --line:#3e2b1d;
  --rust:#ef7a4f; --gold:#f2b84b; --leaf:#a3c46b;
  --keep:#7fd283; --keepbg:#1f3a20; --tweak:#f2c14b; --tweakbg:#3d2f0e; --cut:#ff8a80; --cutbg:#45201c;

}
*{box-sizing:border-box}
html,body{overflow-x:hidden;overflow-x:clip}
img,svg,video{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.45 Nunito,system-ui,sans-serif;-webkit-text-size-adjust:100%}
header{padding:20px 16px 8px;max-width:760px;margin:0 auto}
h1{font:400 30px/1.05 'Alfa Slab One',serif;color:var(--rust);margin:0 0 6px;letter-spacing:.3px}
.sub{color:var(--mute);margin:0;font-size:15px}
.how{margin:12px 0 0;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;font-size:15px}
.how b{color:var(--rust)}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 0 8px}
.bar-in{max-width:760px;margin:0 auto;padding:0 16px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;border-radius:999px;padding:8px 13px;font:800 14px Nunito;background:var(--chip);color:var(--ink);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--rust);color:#fff}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.f{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 10px;font:700 13px Nunito;cursor:pointer}
.f[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.prog{margin-left:auto;font:800 13px Nunito;color:var(--mute)}
.save{font:700 12px Nunito;color:var(--mute);min-height:16px;margin-top:4px}
main{max-width:760px;margin:0 auto;padding:6px 16px 120px}
h2{font:400 22px 'Alfa Slab One',serif;color:var(--rust);margin:22px 0 4px}
h3{font:800 13px Nunito;letter-spacing:1.4px;text-transform:uppercase;color:var(--leaf);margin:18px 0 8px}
.rules{background:var(--card);border:2px dashed var(--gold);border-radius:14px;padding:12px 14px;font-size:15px}
.rules ol{margin:6px 0 4px;padding-left:22px}
.rules .go{font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:14px;padding:12px 12px 10px;margin:10px 0;transition:opacity .2s}
.card.s-keep{border-left-color:var(--keep)}
.card.s-tweak{border-left-color:var(--tweak)}
.card.s-cut{border-left-color:var(--cut);opacity:.6}
.meta{display:flex;gap:6px;align-items:center;margin-bottom:4px;font:800 12px Nunito;color:var(--mute)}
.heat{font-size:15px}
.mine{background:var(--chip);border-radius:999px;padding:1px 8px}
.txt{font-size:18px;font-weight:700;margin:0}
.txt.pbp{font-family:'Alfa Slab One',serif;font-weight:400;font-size:17px;letter-spacing:.2px}
.note{margin:6px 0 0;color:var(--mute);font-style:italic;font-size:15px}
.acts{display:flex;gap:6px;margin-top:10px}
.a{flex:1;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:9px 4px;font:800 14px Nunito;cursor:pointer;min-height:42px}
.a.keep[aria-pressed="true"]{background:var(--keepbg);border-color:var(--keep);color:var(--keep)}
.a.tweak[aria-pressed="true"]{background:var(--tweakbg);border-color:var(--tweak);color:var(--tweak)}
.a.cut[aria-pressed="true"]{background:var(--cutbg);border-color:var(--cut);color:var(--cut)}
.cmt{margin-top:8px;display:none}
.cmt.open{display:block}
.cmt textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:600 16px Nunito;background:var(--bg);color:var(--ink);resize:vertical}
.cbtn{background:none;border:0;color:var(--mute);font:700 13px Nunito;padding:6px 0 0;cursor:pointer;text-decoration:underline}
.adder{margin:10px 0 4px;background:transparent;border:2px dashed var(--line);border-radius:14px;padding:10px 12px}
.adder label{font:800 13px Nunito;color:var(--mute);display:block;margin-bottom:6px}
.adder textarea{width:100%;min-height:54px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:600 16px Nunito;background:var(--card);color:var(--ink)}
.adder button{margin-top:6px;border:0;background:var(--leaf);color:#fff;border-radius:10px;padding:8px 14px;font:800 14px Nunito;cursor:pointer}
.added{background:var(--chip);border-radius:10px;padding:8px 10px;margin-top:6px;font-weight:700;display:flex;gap:8px;align-items:flex-start}
.added button{margin-left:auto;background:none;border:0;color:var(--cut);font:800 13px Nunito;cursor:pointer;padding:0}
.empty{color:var(--mute);font-style:italic;padding:10px 0}
.roster{background:var(--card);border:2px solid var(--leaf);border-radius:14px;padding:12px 14px;margin-top:12px}
.roster b{color:var(--leaf)}
.fld{display:block;margin:10px 0 0;font:800 14px Nunito;color:var(--mute)}
.fld input,.qa input,.qa textarea,.team input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:700 16px Nunito;background:var(--bg);color:var(--ink);margin-top:4px}
.team{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.team .tn{font:800 13px Nunito;color:var(--mute);align-self:start;padding-top:12px;min-width:54px}
.team input{margin-top:0}
.addteam{margin-top:10px;border:0;background:var(--leaf);color:#fff;border-radius:10px;padding:8px 14px;font:800 14px Nunito;cursor:pointer}
.qa{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.qa .q{font-weight:800;margin:0}
.qa .hint{color:var(--mute);font-size:14px;font-style:italic;margin:2px 0 0}
.leaves{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
header,main,.bar{position:relative;z-index:1}
.lf{position:absolute;top:-30px;font-size:20px;opacity:.5;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.lf{animation-duration:60s!important}}
</style>
</head>

/* Team sizes come from the official rules; how MANY teams is the meeting question. */
var TEAM={g1:{size:2,label:'Couple',ph:['Name','Name']},g2:{size:2,label:'Team',ph:['Man 1','Man 2']},g3:{size:5,label:'Team',ph:['Player 1','Player 2','Player 3','Player 4','Player 5']}};
var QS=[
 ['m1','How many couples for Love You to the Last Kernel?','Rules say husband + wife per team. Need a chair, a blindfold and an ear of corn per couple.','g1'],
 ['m2','How many teams for Hay Bale Roll?','Rules say 2 men per team. One hay bale per team.','g2'],
 ['m3','How many teams for Sack Race Relay?','Rules say 5 players per team. One sack per team.','g3'],
 ['m4','Is there first aid? Who has the kit?','Decides which first aid joke you use.'],
 ['m5','What are the prizes, and for which games?',''],
 ['m6','What order do the games go in, and what time?',''],
 ['m7','Who judges the finish line and breaks ties?',''],
 ['m8','Supplies: who brings blindfolds, corn, chairs, hay bales, sacks?',''],
 ['m9','Do I get a microphone / sound system?',''],
 ['m10','Hay bale course: straight to the stage, or around the seating area and back up the middle?','Which one you say changes a rules line.'],
 ['m11','Who loads the hay bales up after?','You’re telling the hay bale teams it’s them.']
];
var HEAT=['😇','😏','😈'];
var KEY=(location.hash.match(/k=([a-z0-9-]+)/)||[])[1]||'';
var API='https://api.jobhubgo.com/api/yam/'+(KEY?'mcfest-'+KEY:'');
var R={reviews:{},adds:[]};          /* reviews[id]={s,c,at}; adds=[{id,sec,t,at,gone?}] */
var tab='open', filt='all';
try{ tab=localStorage.getItem('mc-tab')||'open'; var c=localStorage.getItem('mc-cache-'+KEY); if(c) R=JSON.parse(c); }catch(e){}
function $(s,el){return (el||document).querySelector(s)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

/* ---- server: last write per line wins, so two phones reviewing never wipe each other ---- */
function merge(a,b){
  var out={reviews:{},adds:[]},id;
  a=a||{}; b=b||{};
  var ra=a.reviews||{}, rb=b.reviews||{};
  for(id in ra) out.reviews[id]=ra[id];
  for(id in rb) if(!out.reviews[id]||(rb[id].at||0)>(out.reviews[id].at||0)) out.reviews[id]=rb[id];
  var m={}; (a.adds||[]).concat(b.adds||[]).forEach(function(x){ if(!m[x.id]||(x.at||0)>(m[x.id].at||0)) m[x.id]=x; });
  out.adds=Object.keys(m).map(function(k){return m[k]}).sort(function(x,y){return (x.made||0)-(y.made||0)});
  ['roster','answers'].forEach(function(f){
    var A=a[f]||{}, B=b[f]||{}, o={};
    for(id in A) o[id]=A[id];
    for(id in B) if(!o[id]||(B[id].at||0)>(o[id].at||0)) o[id]=B[id];
    out[f]=o;
  });
  return out;
}
function cache(){ try{ localStorage.setItem('mc-cache-'+KEY,JSON.stringify(R)); }catch(e){} }
var saving=null, again=false;
function status(t){ $('#save').textContent=t; }
function push(){
  cache();
  if(!KEY){ status('⚠️ Open your private link to save'); return; }
  if(saving){ again=true; return; }
  status('Saving…');
  saving=fetch(API,{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
    R=merge(j&&j.data,R);
    return fetch(API,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:R,updatedAt:Date.now()})});
  }).then(function(r){ if(!r.ok) throw 0; status('✓ Saved'); cache(); })
    .catch(function(){ status('⚠️ Not saved yet. It will retry.'); setTimeout(push,4000); })
    .then(function(){ saving=null; if(again){ again=false; push(); } });
}
function pull(){
  if(!KEY) return;
  fetch(API,{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
    R=merge(R,j&&j.data); cache(); render();
  }).catch(function(){});
}

/* ---- view ---- */
function stateOf(id){ var r=R.reviews[id]; return r&&r.s||''; }
function showIt(id){ var s=stateOf(id); return filt==='all'||(filt==='todo'?!s:s===filt); }
function counts(){
  var n=0,d=0; S.forEach(function(sec){ sec.groups.forEach(function(g){ g[1].forEach(function(l){ n++; if(stateOf(l[0])) d++; }); }); });
  return d+' of '+n+' picked';
}
function cardHtml(l){
  var id=l[0], r=R.reviews[id]||{}, s=r.s||'', pbp=/^[^a-z]*$/.test(l[2].replace(/[’…“”]/g,''));
  return '<div class="card'+(s?' s-'+s:'')+'" data-id="'+id+'">'
   +'<div class="meta"><span class="heat" title="heat">'+HEAT[l[1]]+'</span>'+(l[4]?'<span class="mine">★ yours</span>':'')+(l[5]?'<span class="mine">✏️ updated, check it</span>':'')+'</div>'
   +'<p class="txt'+(pbp?' pbp':'')+'">'+esc(l[2])+'</p>'
   +(l[3]?'<p class="note">'+esc(l[3])+'</p>':'')
   +'<div class="acts">'
   +'<button class="a keep" data-s="keep" aria-pressed="'+(s==='keep')+'">✅ Keep</button>'
   +'<button class="a tweak" data-s="tweak" aria-pressed="'+(s==='tweak')+'">✏️ Tweak</button>'
   +'<button class="a cut" data-s="cut" aria-pressed="'+(s==='cut')+'">❌ Cut</button>'
   +'</div>'
   +'<div class="cmt'+(s==='tweak'||r.c?' open':'')+'"><textarea aria-label="Comment on this line" placeholder="What should change?">'+esc(r.c||'')+'</textarea></div>'
   +(s==='tweak'||r.c?'':'<button class="cbtn">💬 Add a comment</button>')
   +'</div>';
}
function ros(k){ R.roster=R.roster||{}; return R.roster[k]||{count:'',teams:[]}; }
function rosterHtml(k){
  var t=TEAM[k], r=ros(k), n=Math.max(parseInt(r.count,10)||0, r.teams.length, 1), h='';
  h+='<div class="roster" data-ros="'+k+'"><b>👥 Teams</b> <span class="hint">('+t.size+' per '+t.label.toLowerCase()+')</span>'
   +'<label class="fld">How many '+(k==='g1'?'couples':'teams')+'?<input inputmode="numeric" data-rf="count" value="'+esc(r.count||'')+'" placeholder="Ask at the meeting"></label>';
  for(var i=0;i<n;i++){
    var tm=r.teams[i]||[];
    h+='<div class="team"><span class="tn" style="grid-row:span '+t.size+'">'+t.label+' '+(i+1)+'</span>';
    for(var j=0;j<t.size;j++) h+='<input aria-label="'+t.label+' '+(i+1)+' '+t.ph[j]+'" data-ti="'+i+'" data-tj="'+j+'" value="'+esc(tm[j]||'')+'" placeholder="'+t.ph[j]+'">';
    h+='</div>';
  }
  return h+'<button class="addteam" data-addteam="'+k+'">+ Add '+t.label.toLowerCase()+'</button></div>';
}
function meetHtml(){
  R.answers=R.answers||{};
  var h='<h2>📋 Questions for the meeting</h2><p class="sub">Fill in the blanks as you get answers. Saves by itself. Team counts also show on each game’s tab.</p>';
  QS.forEach(function(q){
    var v=q[3]?(ros(q[3]).count||''):((R.answers[q[0]]||{}).a||'');
    h+='<div class="qa"><p class="q">'+esc(q[1])+'</p>'+(q[2]?'<p class="hint">'+esc(q[2])+'</p>':'')
      +(q[3]?'<input inputmode="numeric" aria-label="'+esc(q[1])+'" data-cnt="'+q[3]+'" value="'+esc(v)+'" placeholder="Number">'
            :'<textarea rows="2" aria-label="'+esc(q[1])+'" data-ans="'+q[0]+'" placeholder="Answer">'+esc(v)+'</textarea>')+'</div>';
  });
  R.adds.filter(function(a){return a.sec==='meet'&&!a.gone}).forEach(function(a){
    h+='<div class="qa"><p class="q">'+esc(a.t)+' <button class="cbtn" data-del="'+a.id+'">Remove</button></p><textarea rows="2" aria-label="'+esc(a.t)+'" data-ans="'+a.id+'" placeholder="Answer">'+esc((R.answers[a.id]||{}).a||'')+'</textarea></div>';
  });
  return h+'<div class="adder"><label for="add">Add another question</label><textarea id="add" placeholder="e.g. Can kids play the sack race?"></textarea><button id="addbtn">Add</button></div>';
}
function render(){
  var sec=S.filter(function(x){return x.k===tab})[0]||S[0];
  $('#tabs').innerHTML=S.map(function(x){return '<button class="tab" data-k="'+x.k+'" aria-pressed="'+(x.k===sec.k)+'">'+x.emoji+' '+x.name+'</button>'}).join('');
  $('#filters').style.display=sec.k==='meet'?'none':'';
  if(sec.k==='meet'){ $('#main').innerHTML=meetHtml(); return; }
  var h='<h2>'+sec.emoji+' '+esc(sec.rules?sec.rules.title:sec.name)+'</h2>';
  if(sec.rules) h+='<div class="rules"><b>Official rules</b><ol>'+sec.rules.steps.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ol><div class="go">'+esc(sec.rules.go)+'</div></div>';
  if(TEAM[sec.k]) h+=rosterHtml(sec.k);
  sec.groups.forEach(function(g){
    var ls=g[1].filter(function(l){return showIt(l[0])});
    if(!ls.length) return;
    h+='<h3>'+esc(g[0])+'</h3>'+ls.map(cardHtml).join('');
  });
  if(!/<div class="card/.test(h)) h+='<p class="empty">Nothing here with this filter.</p>';
  var mine=R.adds.filter(function(a){return a.sec===sec.k&&!a.gone});
  h+='<h3>Your own lines</h3>'+mine.map(function(a){return '<div class="added"><span>'+esc(a.t)+'</span><button data-del="'+a.id+'" aria-label="Remove this line">Remove</button></div>'}).join('')
   +'<div class="adder"><label for="add">Add a line, or tell me what kind of joke you want here</label><textarea id="add" placeholder="e.g. something about the pastor’s truck"></textarea><button id="addbtn">Add</button></div>';
  $('#main').innerHTML=h;
  $('#prog').textContent=counts();
}
document.addEventListener('click',function(e){
  var t=e.target.closest('button'); if(!t) return;
  if(t.dataset.k){ tab=t.dataset.k; try{localStorage.setItem('mc-tab',tab)}catch(x){} render(); scrollTo({top:0}); return; }
  if(t.dataset.f){ filt=t.dataset.f; document.querySelectorAll('.f').forEach(function(b){b.setAttribute('aria-pressed',b===t)}); render(); return; }
  if(t.dataset.addteam){ var k=t.dataset.addteam, r=ros(k), n=Math.max(parseInt(r.count,10)||0, r.teams.length, 1); while(r.teams.length<n+1) r.teams.push([]); r.at=Date.now(); R.roster[k]=r; render(); push(); return; }
  if(t.dataset.del){ R.adds.forEach(function(a){ if(a.id===t.dataset.del){ a.gone=true; a.at=Date.now(); } }); render(); push(); return; }
  if(t.id==='addbtn'){ var v=$('#add').value.trim(); if(!v) return; var now=Date.now(); R.adds.push({id:'a'+now.toString(36),sec:tab,t:v,at:now,made:now}); render(); push(); return; }
  var card=t.closest('.card'); if(!card) return;
  var id=card.dataset.id, r=R.reviews[id]||{};
  if(t.classList.contains('cbtn')){ card.querySelector('.cmt').classList.add('open'); t.remove(); card.querySelector('textarea').focus(); return; }
  if(t.dataset.s){
    r.s=(r.s===t.dataset.s)?'':t.dataset.s; r.at=Date.now(); R.reviews[id]=r;
    var keepY=card.getBoundingClientRect().top;
    if(filt==='all'){
      card.outerHTML=cardHtml([id].concat(findLine(id).slice(1)));
      var nc=document.querySelector('.card[data-id="'+id+'"]');
      if(r.s==='tweak') nc.querySelector('textarea').focus({preventScroll:true});
      scrollBy(0,nc.getBoundingClientRect().top-keepY);
      $('#prog').textContent=counts();
    } else render();
    push();
  }
});
function findLine(id){ var f; S.forEach(function(s){s.groups.forEach(function(g){g[1].forEach(function(l){ if(l[0]===id) f=l; })})}); return f; }
var typing={};
document.addEventListener('change',function(e){ if(e.target.dataset.rf==='count') render(); });
function later(key){ cache(); clearTimeout(typing[key]); typing[key]=setTimeout(push,900); status('Typing…'); }
document.addEventListener('input',function(e){
  var el=e.target, d=el.dataset, box=el.closest('[data-ros]');
  if(box||d.cnt){
    var k=box?box.dataset.ros:d.cnt, r=ros(k);
    if(d.rf==='count'||d.cnt) r.count=el.value.replace(/[^0-9]/g,'');
    else { var i=+d.ti, j=+d.tj; while(r.teams.length<=i) r.teams.push([]); r.teams[i][j]=el.value; }
    r.at=Date.now(); R.roster[k]=r; later('ros-'+k); return;
  }
  if(d.ans){ R.answers=R.answers||{}; R.answers[d.ans]={a:el.value,at:Date.now()}; later('ans-'+d.ans); return; }
  var card=el.closest('.card'); if(!card) return;
  var id=card.dataset.id, r=R.reviews[id]||{};
  r.c=e.target.value; r.at=Date.now(); R.reviews[id]=r; cache();
  clearTimeout(typing[id]); typing[id]=setTimeout(push,900); status('Typing…');
});
document.addEventListener('visibilitychange',function(){ if(!document.hidden && !saving && !document.activeElement.matches('textarea,input')) pull(); });

/* falling leaves, decoration only */
(function(){ var L=['🍂','🍁','🍃'],box=$('#leaves'); for(var i=0;i<10;i++){ var s=document.createElement('span'); s.className='lf'; s.textContent=L[i%3];
  s.style.left=(Math.random()*96)+'%'; s.style.animationDuration=(14+Math.random()*16)+'s'; s.style.animationDelay=(-Math.random()*30)+'s'; box.appendChild(s);} })();

render(); pull();
if(!KEY) status('⚠️ Open your private link to save');
