<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Boy hero voice</title><style>body{font:18px -apple-system,sans-serif;max-width:640px;margin:20px auto 60px;padding:0 16px;background:#fbf7ef;color:#33261c}
.c{background:#fff;border:2px solid #e5d9c3;border-radius:14px;padding:12px 14px;margin:14px 0}.c.on{border-color:#6b4fb3;background:#f5f0ff}audio{width:100%;margin:6px 0}
button{font:600 18px -apple-system,sans-serif;width:100%;padding:13px;border-radius:12px;border:2px solid #6b4fb3;background:#fff;color:#6b4fb3;margin-top:8px}button.on{background:#6b4fb3;color:#fff}h3{margin:4px 0}.t{margin:8px 0 0;font-size:16px;color:#7a6a55}textarea{width:100%;box-sizing:border-box;font:18px -apple-system,sans-serif;padding:10px;border-radius:12px;border:2px solid #e5d9c3;min-height:90px}#s{position:sticky;bottom:0;background:#fbf7ef;padding:10px 0;font-weight:600;text-align:center}</style>
<h2>Boy voice for the hero</h2><p>Both hero voices in the game now are girl voices. Here are 4 boy voices saying the same 3 lines. Pick one, it saves by itself. It becomes a third voice choice, so the girl voices stay.</p><div id="list"></div>
<div class="c"><h3>Anything else?</h3><textarea id="n" placeholder="Optional, like higher, younger, more excited"></textarea></div><div id="s"></div>
<script>var L=["Three weeks, Grandma. Not a single letter. You always write back.","Have you seen her? She hasn't written to me in weeks.","Then let's find her. Maybe there's a clue in Grandma's things."];
var G=[["alloy","Boy 1",["c6c12d73","7f80dd22","ae822dbd"]],["cedar","Boy 2",["adbb6035","e51abb3e","8a08a1cc"]],["echo","Boy 3",["71c7aef9","66f63303","a0560eaf"]],["ash","Boy 4",["a66dccb0","dcb0b4dd","30abb8f2"]]];
document.getElementById("list").innerHTML=G.map(function(g){return '<div class="c" data-g="'+g[0]+'"><h3>'+g[1]+'</h3>'+L.map(function(t,i){return '<p class="t">'+t+'</p><audio controls preload="none" src="'+g[0]+'_'+"abc"[i]+'.mp3?v='+g[2][i]+'"></audio>'}).join("")+'<button data-o="'+g[0]+'"></button></div>'}).join("");
var key=(location.hash.match(/k=([a-z0-9-]+)/)||[])[1]||"",url="https://api.jobhubgo.com/api/yam/"+key,LS="moonberry-boyvoice-"+key;
var d={pick:"",notes:""},at=0,seq=0,t=null,st=document.getElementById("s"),n=document.getElementById("n");
function paint(){document.querySelectorAll("[data-o]").forEach(function(b){var on=d.pick===b.dataset.o;b.classList.toggle("on",on);b.textContent=on?"✓ Picked":"Pick this one";document.querySelector('[data-g="'+b.dataset.o+'"]').classList.toggle("on",on)});if(document.activeElement!==n)n.value=d.notes||""}
function save(){at=Date.now();var my=++seq;try{localStorage.setItem(LS,JSON.stringify({d:d,at:at}))}catch(e){}if(!key){st.textContent="Open this from the link in chat so it can save.";return}
st.textContent="Saving...";fetch(url,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({data:d,updatedAt:at})}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){if(my===seq)st.textContent=j.ok?"✓ Saved":"Not saved, reload the page"}).catch(function(){if(my===seq){st.textContent="Not saved, trying again...";clearTimeout(t);t=setTimeout(save,4000)}})}
document.addEventListener("click",function(e){var b=e.target;if(b.dataset&&b.dataset.o){d.pick=b.dataset.o;paint();save()}});
n.addEventListener("input",function(){d.notes=n.value;st.textContent="Saving...";clearTimeout(t);t=setTimeout(save,900)});
document.addEventListener("play",function(e){document.querySelectorAll("audio").forEach(function(a){if(a!==e.target)a.pause()})},true);
try{var l=JSON.parse(localStorage.getItem(LS)||"null");if(l){d=l.d;at=l.at}}catch(e){}paint();
if(key){fetch(url).then(function(r){return r.json()}).then(function(j){if(j.data&&j.updatedAt>=at&&seq===0){d=j.data;at=j.updatedAt;paint();if(d.pick)st.textContent="✓ Saved"}else if(at&&seq===0)save()}).catch(function(){})}else st.textContent="Open this from the link in chat so it can save.";
</script></html>
