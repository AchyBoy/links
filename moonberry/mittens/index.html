<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>New Mittens</title>
<style>body{font:17px -apple-system,sans-serif;margin:0;background:#1d1430;color:#f3ecff}main{max-width:640px;margin:0 auto 50px;padding:0 14px}h2{margin:14px 0 4px}#v{width:100%;height:min(66vh,560px);border-radius:16px;overflow:hidden;background:#3a1a63;touch-action:none}canvas{display:block;width:100%;height:100%}.r{display:flex;gap:8px;margin:10px 0}button{flex:1;font:600 17px -apple-system,sans-serif;padding:12px 6px;border-radius:12px;border:2px solid #b48cff;background:transparent;color:#e7d9ff}button.on{background:#b48cff;color:#1d1430}.p{display:flex;gap:10px}.p div{flex:1;text-align:center;font-size:15px}.p img{width:100%;border-radius:12px;display:block}textarea{width:100%;box-sizing:border-box;font:17px -apple-system,sans-serif;padding:10px;border-radius:12px;min-height:80px}#s{text-align:center;font-weight:600;min-height:24px;margin-top:8px}</style>
<main><h2>New Mittens</h2><p style="margin:4px 0 10px">Drag to spin, pinch or scroll to zoom.</p><div id="v"></div>
<div class="r"><button data-m="Sit" class="on">Sit</button><button data-m="Walk">Walk</button></div><div class="r"><button data-l="day" class="on">Evening</button><button data-l="night">Night</button></div>
<h3>Compare</h3><div class="p"><div><img src="now.jpg?v=7b95f237">In the game now</div><div><img src="portrait.jpg?v=7d7e8520">Her painting (the target)</div></div>
<h3>What do you think?</h3><div class="r"><button data-p="yes">Use her</button><button data-p="close">Close</button><button data-p="no">No</button></div><textarea id="n" placeholder="What should change? (optional)"></textarea><div id="s"></div></main>
<script type="module">
import * as T from "./three.module.min.js";
const el=document.getElementById("v"),R=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;el.appendChild(R.domElement);
const S=new T.Scene(),cam=new T.PerspectiveCamera(30,1,.1,50);
const hemi=new T.HemisphereLight(0xb9a4ff,0x3a2458,1.5),key=new T.DirectionalLight(0xfff0e0,2.2),rim=new T.DirectionalLight(0xffa940,3.2),fill=new T.DirectionalLight(0x9a7bff,.9);
key.position.set(1.6,3,3.2);key.castShadow=true;key.shadow.mapSize.set(1024,1024);Object.assign(key.shadow.camera,{left:-1.6,right:1.6,top:1.8,bottom:-1,near:.5,far:9});key.shadow.bias=-.0006;key.shadow.normalBias=.02;rim.position.set(-3,2.2,-.6);fill.position.set(3,1,-2);S.add(hemi,key,rim,fill);
const fl=new T.Mesh(new T.CircleGeometry(2.2,48),new T.MeshStandardMaterial({color:0x5a3290,roughness:1}));fl.rotation.x=-Math.PI/2;fl.receiveShadow=true;S.add(fl);
function light(k){const d=k==="day";S.background=new T.Color(d?0x4a2380:0x0f0c22);hemi.intensity=d?1.6:1.15;key.intensity=d?2.4:1.5;key.color.set(d?0xfff0e0:0x8fa4ff);rim.intensity=d?3.4:2.2;rim.color.set(d?0xffa940:0x7f9bff);fill.intensity=d?.9:.5;fl.material.color.set(d?0x5a3290:0x2a2148)}
const data=await (await fetch("mittens.json?v=7ef1d7c9")).json(),N={};
for(const n of data){const g=new T.Group();g.position.set(...n.pos);N[n.name]=g;g.userData.p=n.parent;for(const m of n.meshes){const b=new T.BufferGeometry();b.setAttribute("position",new T.Float32BufferAttribute(m.v,3));b.computeVertexNormals();const x=new T.Mesh(b,new T.MeshStandardMaterial({color:m.c,roughness:.75,flatShading:true,emissive:m.c,emissiveIntensity:m.e||0}));x.castShadow=true;x.receiveShadow=true;g.add(x)}}
for(const k in N){const p=N[k].userData.p;(p?N[p]:S).add(N[k])}
let mode="Sit",yaw=.45,pitch=.14,dist=4.1,spin=true;const lid=[];
function show(){N.Sit.visible=mode==="Sit";N.Walk.visible=mode==="Walk"}show();light("day");
function size(){const w=el.clientWidth,h=el.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}size();addEventListener("resize",size);
const P=new Map();let pd=0;el.addEventListener("pointerdown",e=>{spin=false;try{el.setPointerCapture(e.pointerId)}catch(_){ }P.set(e.pointerId,[e.clientX,e.clientY])});
el.addEventListener("pointermove",e=>{const o=P.get(e.pointerId);if(!o)return;if(P.size===1){yaw-=(e.clientX-o[0])*.009;pitch=Math.max(-.05,Math.min(1.2,pitch+(e.clientY-o[1])*.006))}P.set(e.pointerId,[e.clientX,e.clientY]);if(P.size===2){const a=[...P.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(pd)dist=Math.max(1.8,Math.min(6,dist*pd/d));pd=d}});
const up=e=>{P.delete(e.pointerId);pd=0};el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);el.addEventListener("wheel",e=>{e.preventDefault();dist=Math.max(1.8,Math.min(6,dist*(1+e.deltaY*.001)))},{passive:false});
addEventListener("message",()=>{});window.__cam=(y,p,d)=>{spin=false;yaw=y;pitch=p;if(d)dist=d};
const c=new T.Clock();R.setAnimationLoop(()=>{const t=c.getElapsedTime();if(spin)yaw=.45+Math.sin(t*.5)*.55;
const w=mode==="Walk",s=t*6.5;
for(const [k,ph] of [["FL",0],["BR",0],["FR",Math.PI],["BL",Math.PI]])N["WalkLeg"+k].rotation.x=w?Math.sin(s+ph)*.5:0;
N.WalkBody.position.y=N.WalkNeck.position.y=0;N.WalkNeck.position.y=.5+Math.abs(Math.sin(s))*.015;N.WalkBody.position.y=Math.abs(Math.sin(s))*.015;
for(let i=0;i<6;i++){const a=N["SitTail"+i];if(a){a.rotation.y=Math.sin(t*1.5-i*.45)*.05;a.rotation.z=Math.sin(t*1.5-i*.45)*.04}const b=N["WalkBodyTail"+i];if(b)b.rotation.z=Math.sin(t*3-i*.5)*.09}
N.SitHead.rotation.z=Math.sin(t*.8)*.03;N.SitHead.rotation.y=Math.sin(t*.45)*.1;N.SitHead.position.y=.69+Math.sin(t*1.6)*.005;
const f=(t%4.2)<.14?.35:0;N.SitHeadEarL.rotation.z=f;N.WalkNeckHeadEarR.rotation.z=-f;
const y0=w?.62:.66;cam.position.set(Math.sin(yaw)*Math.cos(pitch)*dist,y0+Math.sin(pitch)*dist,Math.cos(yaw)*Math.cos(pitch)*dist);cam.lookAt(0,y0,0);R.render(S,cam)});
// picks
const pk=(location.hash.match(/k=([a-z0-9-]+)/)||[])[1]||"",url="https://api.jobhubgo.com/api/yam/"+pk,st=document.getElementById("s"),n=document.getElementById("n");let d={pick:null,notes:""},at=0,q=0,tm;
function paint(){document.querySelectorAll("[data-p]").forEach(b=>b.classList.toggle("on",b.dataset.p===d.pick));if(document.activeElement!==n)n.value=d.notes||""}
function save(){at=Date.now();const my=++q;if(!pk){st.textContent="Open this from the link in chat so it can save.";return}st.textContent="Saving...";fetch(url,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({data:d,updatedAt:at})}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{if(my===q)st.textContent=j.ok?"✓ Saved":"Not saved, reload the page"}).catch(()=>{if(my===q){st.textContent="Not saved, trying again...";clearTimeout(tm);tm=setTimeout(save,4000)}})}
document.addEventListener("click",e=>{const b=e.target.dataset||{};if(b.m){mode=b.m;show();document.querySelectorAll("[data-m]").forEach(x=>x.classList.toggle("on",x.dataset.m===mode))}if(b.l){light(b.l);document.querySelectorAll("[data-l]").forEach(x=>x.classList.toggle("on",x.dataset.l===b.l))}if(b.p){d.pick=b.p;paint();save()}});
n.addEventListener("input",()=>{d.notes=n.value;st.textContent="Saving...";clearTimeout(tm);tm=setTimeout(save,900)});
if(pk)fetch(url).then(r=>r.json()).then(j=>{if(j.data&&q===0){d=j.data;paint();st.textContent=d.pick?"✓ Saved":""}}).catch(()=>{});
window.__ready=1;
</script></html>
