<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plan 003 in 3D</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
html,body{margin:0;height:100%;background:#dfe7ee;font-family:-apple-system,system-ui,sans-serif}
model-viewer{width:100%;height:100%;--poster-color:#dfe7ee}
.bar{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0);display:flex;gap:8px;justify-content:center;padding:10px}
.bar button{font-size:16px;padding:10px 16px;border-radius:22px;border:0;background:#fff;color:#111;box-shadow:0 1px 4px #0003}
.bar button.on{background:#111;color:#fff}
.tip{position:fixed;bottom:calc(env(safe-area-inset-bottom,0) + 12px);left:0;right:0;text-align:center;font-size:13px;color:#333}
</style></head><body>
<model-viewer id="mv" src="plan-003-outside.glb?v=680635ee" camera-controls touch-action="none"
  shadow-intensity="1" exposure="1.0" environment-image="neutral" camera-orbit="-30deg 70deg auto"
  min-camera-orbit="auto 0deg auto" max-camera-orbit="auto 90deg auto" alt="Plan 003 3D model"></model-viewer>
<div class="bar">
  <button id="out" class="on">Outside</button>
  <button id="in">Inside (roof off)</button>
</div>
<div class="tip">One finger: spin &middot; Pinch: zoom &middot; Two fingers: move</div>
<script>
const mv=document.getElementById('mv'),o=document.getElementById('out'),i=document.getElementById('in');
o.onclick=()=>{mv.src='plan-003-outside.glb?v=680635ee';mv.cameraOrbit='-30deg 70deg auto';o.className='on';i.className=''};
i.onclick=()=>{mv.src='plan-003-inside.glb?v=d20d7ca8';mv.cameraOrbit='0deg 35deg auto';i.className='on';o.className=''};
</script>
</body></html>
