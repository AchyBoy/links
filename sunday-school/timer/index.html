<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="x-timer-version" content="1.1">
<title>Babel Timer</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#111;color:#fff;font-family:-apple-system,Helvetica,Arial,sans-serif;user-select:none;-webkit-user-select:none}
body{display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 14px);transition:background .15s}
body.sw{background:#7f1d1d}
body.done{background:#2e7d32}
h1{margin:0;font-size:15px;letter-spacing:3px;color:#d4a94a;text-align:center;font-weight:800}
.box{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:18px;margin-top:10px;background:#1d1d1d;position:relative}
.lbl{font-size:16px;letter-spacing:2px;color:#aaa;font-weight:700}
.big{font-variant-numeric:tabular-nums;font-weight:800;line-height:1}
#tot{font-size:min(30vw,22vh)}
#rot{font-size:min(26vw,18vh);color:#ffcf5c}
.sub{font-size:18px;color:#ccc;margin-top:6px;font-weight:600;min-height:22px}
.adj{position:absolute;right:10px;top:10px;display:flex;gap:6px}
.adj button{width:44px;height:36px;border-radius:10px;border:0;background:#333;color:#fff;font-size:15px;font-weight:700}
.row{display:flex;gap:10px;margin-top:12px}
.row button{flex:1;height:74px;border:0;border-radius:16px;font-size:26px;font-weight:800;color:#fff}
#go{background:#2e7d32} #go.pause{background:#b26a00}
#reset{background:#444;flex:.6}
#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:22vw;font-weight:900;pointer-events:none;text-shadow:0 4px 20px #000}
body.done #msg{display:flex}
#rot.sw{color:#fff}
.pz{margin-top:8px;font-size:15px;color:#aaa;display:flex;align-items:center;gap:8px}
.pz button{width:40px;height:32px;border-radius:9px;border:0;background:#333;color:#fff;font-weight:700}
</style></head><body>
<h1>BABEL CONSTRUCTION CO.</h1>
<div class="box">
  <div class="adj"><button data-k="tot" data-d="-30">−30</button><button data-k="tot" data-d="30">+30</button></div>
  <div class="lbl">GAME</div>
  <div class="big" id="tot">2:00</div>
</div>
<div class="box">
  <div class="adj"><button data-k="rot" data-d="-5">−5</button><button data-k="rot" data-d="5">+5</button></div>
  <div class="lbl" id="rlbl">SWITCH IN</div>
  <div class="big" id="rot">0:30</div>
  <div class="sub" id="crew">Crew 1</div>
  <div class="pz">Hands-off pause <button data-k="sw" data-d="-5">−</button><b id="swv">10s</b><button data-k="sw" data-d="5">+</button></div>
</div>
<div class="row"><button id="reset">Reset</button><button id="go">Start</button></div>
<div id="msg">SWITCH!</div>
<script>
var TOT = Number(localStorage.getItem('bt-tot')) || 120, ROT = Number(localStorage.getItem('bt-rot')) || 30;
var SW = localStorage.getItem('bt-sw') === null ? 10 : Number(localStorage.getItem('bt-sw'));
var running = false, elapsed = 0, startedAt = 0, ended = false, lastPhase = 'b0', ctx = null, wake = null, raf = 0;
var $ = function(id){ return document.getElementById(id); };
function fmt(s){ s = Math.max(0, Math.ceil(s - 1e-6)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }
function now(){ return running ? elapsed + (performance.now() - startedAt)/1000 : elapsed; }
function audio(){
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch(e){}
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') ctx.resume();
}
function buzz(sec, freq){
  if (!ctx) return;
  var o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'square'; o.frequency.value = freq; g.gain.value = 0.35;
  o.connect(g); g.connect(ctx.destination);
  var t = ctx.currentTime; o.start(t); g.gain.setValueAtTime(0.35, t + sec - 0.05); g.gain.linearRampToValueAtTime(0, t + sec); o.stop(t + sec);
}
// Build ROT seconds, then a hands-off pause of SW seconds, repeat. The GAME clock only counts building.
function state(t){
  var N = Math.ceil(TOT / ROT), cyc = ROT + SW, k = Math.floor(t / cyc);
  if (k >= N - 1) {                       // last crew, no pause after it
    var into = t - (N - 1) * cyc, len = TOT - (N - 1) * ROT;
    return { crew: N, N: N, sw: false, built: Math.min(TOT, (N - 1) * ROT + into), left: Math.max(0, len - into), end: into >= len };
  }
  var w = t - k * cyc;
  if (w < ROT) return { crew: k + 1, N: N, sw: false, built: k * ROT + w, left: ROT - w, end: false };
  return { crew: k + 2, N: N, sw: true, built: (k + 1) * ROT, left: cyc - w, end: false };
}
function draw(){
  var s = state(now());
  $('tot').textContent = fmt(TOT - s.built);
  $('rot').textContent = fmt(s.left);
  $('rot').classList.toggle('sw', s.sw);
  $('rlbl').textContent = s.sw ? 'HANDS OFF · NEXT CREW IN' : 'SWITCH IN';
  $('crew').textContent = ended ? 'Hands off!' : (s.sw ? 'Crew ' + s.crew + ' step up' : 'Crew ' + s.crew + ' of ' + s.N);
  document.body.classList.toggle('sw', s.sw && !ended);
  $('swv').textContent = SW + 's';
  if (running && !ended) {
    var ph = (s.sw ? 's' : 'b') + s.crew;
    if (s.end) {
      elapsed = now(); ended = true; running = false; buzz(1.6, 220);
      $('msg').textContent = 'TIME!'; document.body.classList.add('done'); setBtn(); release();
    } else if (ph !== lastPhase) {
      if (s.sw) buzz(0.8, 330); else { buzz(0.15, 880); setTimeout(function(){ buzz(0.15, 880); }, 220); }
      lastPhase = ph;
    }
  }
  if (running) raf = requestAnimationFrame(draw);
}
function setBtn(){ var b = $('go'); b.textContent = ended ? 'Again' : running ? 'Pause' : (elapsed > 0 ? 'Resume' : 'Start'); b.classList.toggle('pause', running); }
async function hold(){ try { if ('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); } catch(e){} }
function release(){ try { wake && wake.release(); } catch(e){} wake = null; }
function reset(){
  running = false; elapsed = 0; lastPhase = 'b1'; ended = false; release();
  document.body.classList.remove('sw', 'done'); setBtn(); draw();
}
$('go').onclick = function(){
  audio();
  if (ended) { reset(); return; }
  if (running) { elapsed = now(); running = false; release(); }
  else { startedAt = performance.now(); running = true; hold(); if (elapsed === 0) { lastPhase = 'b1'; buzz(0.25, 660); } raf = requestAnimationFrame(draw); }
  setBtn(); draw();
};
$('reset').onclick = reset;
document.querySelectorAll('[data-k]').forEach(function(b){
  b.onclick = function(){
    if (running || elapsed > 0) return; // change only while stopped
    var d = Number(b.dataset.d), k = b.dataset.k;
    if (k === 'tot') TOT = Math.min(1200, Math.max(30, TOT + d));
    else if (k === 'rot') ROT = Math.min(120, Math.max(5, ROT + d));
    else SW = Math.min(30, Math.max(0, SW + d));
    localStorage.setItem('bt-tot', TOT); localStorage.setItem('bt-rot', ROT); localStorage.setItem('bt-sw', SW); draw();
  };
});
document.addEventListener('visibilitychange', function(){ if (!document.hidden && running) hold(); });
reset();
</script>
</body></html>
